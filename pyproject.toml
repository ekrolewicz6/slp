[project]
name = "language-state-modeling"
version = "0.1.0"
description = "Computational Language State & Recovery Modeling (SLP / Aphasia Focus)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pylangacq>=0.19.0",
    "pandas>=2.2",
    "numpy>=1.26,<2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "joblib>=1.4",
    "requests>=2.32",
    "pyarrow>=15",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
phase2plus = [
    "torch>=2.3",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "umap-learn>=0.5",
    "shap>=0.46",
    "statsmodels>=0.14",
]
asr = [
    "openai-whisper>=20250625",
    "numba==0.61.2",
    "llvmlite==0.44.0",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
